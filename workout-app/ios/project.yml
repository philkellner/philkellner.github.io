name: Workout
options:
  bundleIdPrefix: com.example   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""        # set to your Apple team ID
targets:
  Workout:
    type: application
    platform: iOS
    sources: [Phone, Shared]
    dependencies:
      - target: WorkoutWatch
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Workout
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Reads your workouts from Apple Health.
        NSHealthUpdateUsageDescription: Saves your strength workouts to Apple Health.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # lets you test against http://<mac-ip>:8000; use https in production
    entitlements:
      path: Phone/Workout.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.workout
  WorkoutWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Workout
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.workout
        WKBackgroundModes: [workout-processing]   # lets the workout session keep running between sets
        NSHealthShareUsageDescription: Shows your heart rate and calories during workouts.
        NSHealthUpdateUsageDescription: Saves your strength workouts to Apple Health.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Watch/WorkoutWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.workout.watchkitapp
