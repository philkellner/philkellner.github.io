name: Workout
options:
  bundleIdPrefix: com.example   # change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""        # set to your Apple team ID
targets:
  Workout:
    type: application
    platform: iOS
    sources: [Phone, Shared]
    dependencies:
      - target: WorkoutWatch
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Workout
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # lets you test against http://<mac-ip>:8000; use https in production
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.workout
  WorkoutWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Workout
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.workout
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.workout.watchkitapp
